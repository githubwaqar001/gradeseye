name: Build GradesEye APKs

# Builds both apps' debug APKs on every push to main, or on demand (Actions tab > Run workflow).
# No local gradlew/gradle-wrapper.jar is committed — gradle/actions/setup-gradle installs
# Gradle itself on the runner, since this project was assembled somewhere that cannot reach
# services.gradle.org or dl.google.com to generate/vendor those files locally.
#
# Does NOT use android-actions/setup-android@v3 — GitHub's ubuntu-latest runner image
# already ships a current Android SDK (cmdline-tools, platform-tools, recent platforms
# and build-tools) at $ANDROID_HOME, and that action has been unreliable against
# Google's current SDK repository manifests. We just make sure the exact platform/
# build-tools this project needs are present and licensed, then build directly.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ teacher, student ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK packages (platform 34, build-tools 34.0.0)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name sdkmanager 2>/dev/null | sort -r | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | sort -r | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ matrix.app }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GradesEye-${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/app/build/outputs/apk/debug/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GradesEye-${{ matrix.app }}-build-report
          path: |
            ${{ matrix.app }}/app/build/outputs/logs/**
            ${{ matrix.app }}/app/build/reports/**
          if-no-files-found: ignore
