name: Build GradesEye APKs

# Builds both apps' debug APKs on every push to main, or on demand (Actions tab > Run workflow).
# No local gradlew/gradle-wrapper.jar is committed — gradle/actions/setup-gradle installs
# Gradle itself on the runner, since this project was assembled somewhere that cannot reach
# services.gradle.org or dl.google.com to generate/vendor those files locally.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [ teacher, student ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ matrix.app }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GradesEye-${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
